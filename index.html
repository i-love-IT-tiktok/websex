<script>
const GITHUB_USER = 'YOUR_USERNAME';
const GITHUB_REPO = 'YOUR_REPO';

async function loadReleases() {
  const res = await fetch(
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases?per_page=50`
  );
  const releases = await res.json();

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  releases.forEach(rel => {
    const videoAsset = rel.assets.find(a =>
      /\.(mp4|webm|mov|m3u8)$/i.test(a.name)
    );
    if (!videoAsset) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="info">
        <h4>${escapeHtml(rel.name || rel.tag_name)}</h4>
        <div class="meta">${escapeHtml(rel.body || '').slice(0, 80)}</div>
      </div>
    `;
    card.addEventListener('click', () => {
      document.getElementById('playerVideo').src = videoAsset.browser_download_url;
      document.getElementById('playerTitle').textContent = rel.name || rel.tag_name;
      document.getElementById('playerModal').style.display = 'block';
    });
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

loadReleases();
</script>
